<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="500" viewBox="0 0 1600 500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d1117"/>
      <stop offset="100%" style="stop-color:#161b22"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#58a6ff"/>
      <stop offset="100%" style="stop-color:#79c0ff"/>
    </linearGradient>
  </defs>

  <rect width="1600" height="500" fill="url(#bg)"/>

  <g opacity="0.04" stroke="#58a6ff" stroke-width="1">
    <line x1="0" y1="100" x2="1600" y2="100"/>
    <line x1="0" y1="200" x2="1600" y2="200"/>
    <line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="200" y1="0" x2="200" y2="500"/>
    <line x1="400" y1="0" x2="400" y2="500"/>
    <line x1="600" y1="0" x2="600" y2="500"/>
    <line x1="800" y1="0" x2="800" y2="500"/>
    <line x1="1000" y1="0" x2="1000" y2="500"/>
    <line x1="1200" y1="0" x2="1200" y2="500"/>
    <line x1="1400" y1="0" x2="1400" y2="500"/>
  </g>

  <g transform="translate(80, 60)">
    <circle cx="0" cy="0" r="8" fill="#ff5f57"/>
    <circle cx="24" cy="0" r="8" fill="#febc2e"/>
    <circle cx="48" cy="0" r="8" fill="#28c840"/>
  </g>

  <rect x="80" y="120" width="120" height="4" rx="2" fill="url(#accent)"/>

  <text x="80" y="200" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="72" font-weight="700" fill="#f0f6fc" letter-spacing="2">HECTOR GARRIDO</text>

  <text x="80" y="270" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#58a6ff">Technology Manager</text>

  <text x="80" y="340" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="24" font-weight="400" fill="#8b949e">Industrial Automation  |  AI  |  Software Architecture  |  Odoo</text>

  <text x="80" y="400" font-family="Segoe UI, system-ui, -apple-system, sans-serif" font-size="22" font-weight="400" fill="#6e7681">Madrid, Spain</text>

  <text x="1480" y="280" font-family="Cascadia Code, Fira Code, monospace" font-size="180" font-weight="300" fill="#21262d" text-anchor="end">{ }</text>
